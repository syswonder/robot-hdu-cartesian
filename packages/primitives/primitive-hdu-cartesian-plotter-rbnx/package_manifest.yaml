manifestVersion: 1

package:
  name: robonix.primitive.hdu.plotter
  version: 0.1.0
  description: XYZ 三轴写字机 primitive — 基于 SDK 的 PLC/TCP 传输、逐点轨迹、回零、参数与状态。
  tags: [primitive, plotter, xyz, gantry, plc, tcp]
  maintainers:
    - shadosider <1439107161@qq.com>
    - MuoTT <muott0927@gmail.com>
  license: MIT

build: bash scripts/build.sh
start: bash scripts/start.sh

# Package-local contracts: this primitive owns the plotter surface.
# driver uses the shared lifecycle Driver.srv; the rest live under
# capabilities/lib/plotter/{srv,msg}.
capabilities:
  - name: robonix/primitive/plotter/driver
  - name: robonix/primitive/plotter/trajectory
  - name: robonix/primitive/plotter/home
  - name: robonix/primitive/plotter/set_params
  - name: robonix/primitive/plotter/status
  - name: robonix/primitive/plotter/geometry

depends: []